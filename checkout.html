
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | 4LOW-MART</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
    }

    .logo {
      color: #FF6B2C;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .section {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      background: #222;
      border: 1px solid #444;
      border-radius: 7px;
      color: white;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #FF6B2C;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .back {
      display: inline-block;
      color: #FF6B2C;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .empty {
      color: #aaa;
      line-height: 1.6;
    }

    @media(max-width: 650px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">4LOW-MART.</div>

    <a href="index.html" class="back">
      ← Continue Shopping
    </a>

    <h1>Checkout</h1>

    <div class="checkout-grid">

      <div class="section">
        <h2>Delivery Details</h2>

        <form id="checkout-form">

          <input
            type="text"
            id="name"
            placeholder="Full Name"
            maxlength="80"
            required
          >

          <input
            type="tel"
            id="phone"
            placeholder="10-digit Mobile Number"
            inputmode="numeric"
            pattern="[6-9][0-9]{9}"
            maxlength="10"
            required
          >

          <textarea
            id="address"
            placeholder="Full Delivery Address"
            maxlength="300"
            required
          ></textarea>

          <input
            type="text"
            id="city"
            placeholder="City"
            maxlength="60"
            required
          >

          <input
            type="text"
            id="pincode"
            placeholder="6-digit PIN Code"
            inputmode="numeric"
            pattern="[1-9][0-9]{5}"
            maxlength="6"
            required
          >

          <button type="submit">
            Continue to Payment
          </button>

        </form>
      </div>

      <div class="section">
        <h2>Order Summary</h2>

        <div id="order-items"></div>

        <div class="total">
          <span>Total</span>
          <span id="order-total">₹0</span>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "YOUR_PROJECT_URL";
  const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

  let cart = [];

  try {
    const savedCart = JSON.parse(
      localStorage.getItem("4lowMartCart") || "[]"
    );

    if (Array.isArray(savedCart)) cart = savedCart;
  } catch (error) {
    cart = [];
  }

  const orderItems = document.getElementById("order-items");
  const orderTotal = document.getElementById("order-total");
  const checkoutForm = document.getElementById("checkout-form");
  const submitButton = checkoutForm.querySelector("button");

  let total = 0;

  function formatPrice(price) {
    return "₹" + price.toLocaleString("en-IN");
  }

  function renderOrder() {
    orderItems.replaceChildren();
    total = 0;

    if (cart.length === 0) {
      orderItems.textContent = "Your cart is empty.";
      orderTotal.textContent = "₹0";
      submitButton.disabled = true;
      return;
    }

    for (const item of cart) {
      if (
        typeof item.name !== "string" ||
        !Number.isFinite(item.price) ||
        !Number.isInteger(item.quantity) ||
        item.price < 0 ||
        item.quantity < 1
      ) {
        orderItems.textContent = "Invalid cart data.";
        orderTotal.textContent = "₹0";
        submitButton.disabled = true;
        return;
      }

      total += item.price * item.quantity;

      const row = document.createElement("div");
      row.className = "order-item";

      const name = document.createElement("span");
      name.textContent = item.name + " × " + item.quantity;

      const price = document.createElement("strong");
      price.textContent = formatPrice(item.price * item.quantity);

      row.append(name, price);
      orderItems.appendChild(row);
    }

    orderTotal.textContent = formatPrice(total);
    submitButton.disabled = false;
  }

  checkoutForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }

    if (!checkoutForm.reportValidity()) return;

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {
      alert("Supabase library did not load. Refresh and try again.");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Saving order...";

    const order = {
      customer_name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      address: document.getElementById("address").value.trim(),
      city: document.getElementById("city").value.trim(),
      pincode: document.getElementById("pincode").value.trim(),
      items: cart.map(item => ({
        name: item.name,
        price: item.price,
        quantity: item.quantity
      })),
      total: total,
      status: "pending"
    };

    try {
      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const { error } = await db
        .from("orders")
        .insert([order]);

      if (error) throw error;

      alert("Demo order saved successfully!");
      submitButton.textContent = "Order Saved ✓";

    } catch (error) {
      console.error("Order error:", error);
      alert("Order could not be saved: " + error.message);

      submitButton.disabled = false;
      submitButton.textContent = "Continue to Payment";
    }
  });

  renderOrder();
        </script>

</body>
</html>
