
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4LOW-MART | Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 30px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
}

.logo span {
  color: #FF6B2C;
}

h2 {
  margin-bottom: 20px;
}

button {
  background: #FF6B2C;
  color: #fff;
  border: none;
  padding: 11px 16px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.secondary {
  background: #252525;
}

input, select {
  background: #171717;
  color: #fff;
  border: 1px solid #444;
  padding: 11px;
  border-radius: 6px;
  width: 100%;
}

.login-box {
  max-width: 400px;
  margin: 70px auto;
  background: #151515;
  padding: 25px;
  border: 1px solid #292929;
  border-radius: 12px;
}

.login-box h2 {
  color: #FF6B2C;
}

.login-box input {
  margin-bottom: 15px;
}

.login-box button {
  width: 100%;
}

.message {
  margin: 15px 0;
  color: #FF6B2C;
  overflow-wrap: anywhere;
}

.dashboard {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: #151515;
  border: 1px solid #292929;
  padding: 22px;
  border-radius: 10px;
}

.stat-card p {
  color: #aaa;
  margin-bottom: 12px;
}

.stat-card h3 {
  font-size: 26px;
  color: #FF6B2C;
  overflow-wrap: anywhere;
}

.orders-section {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 10px;
  padding: 18px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

th, td {
  text-align: left;
  padding: 13px;
  border-bottom: 1px solid #333;
  font-size: 13px;
  vertical-align: top;
  overflow-wrap: anywhere;
  max-width: 240px;
}

th {
  color: #FF6B2C;
}

td select {
  min-width: 125px;
  margin-bottom: 8px;
}

.update-btn {
  padding: 9px 12px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

@media(max-width: 600px) {
  body {
    padding: 12px;
  }

  .logo {
    font-size: 21px;
  }

  .orders-section {
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">4LOW-<span>MART</span> ADMIN</div>
  </header>

  <!-- LOGIN -->
  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">Login</button>
    </form>

    <p class="message" id="loginMessage"></p>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <div class="toolbar">
      <h2>Dashboard Overview</h2>

      <div>
        <button class="secondary" id="refreshBtn">Refresh Orders</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <p class="message" id="orderMessage"></p>

    <div class="stats">

      <div class="stat-card">
        <p>Total Orders</p>
        <h3 id="totalOrders">0</h3>
      </div>

      <div class="stat-card">
        <p>Total Order Value</p>
        <h3 id="totalValue">₹0</h3>
      </div>

      <div class="stat-card">
        <p>Pending Orders</p>
        <h3 id="pendingOrders">0</h3>
      </div>

    </div>

    <div class="orders-section">
      <h2>Customer Orders</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Address</th>
              <th>City</th>
              <th>Pincode</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="ordersList">
            <tr>
              <td colspan="10">Please log in.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://vnfbxbwtvtwigijflbgl.supabase.co";

const SUPABASE_KEY = "sb_publishable_oNf_99Vfv2vdyqgJ5lyRCA_UzPfETXV";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ELEMENTS */

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");

/* HELPERS */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function money(value) {
  return "₹" + Number(value || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function showMessage(message) {
  document.getElementById("loginMessage").textContent = message;
}

/* LOAD ORDERS */

async function loadOrders() {
  const output = document.getElementById("ordersList");
  const info = document.getElementById("orderMessage");

  output.innerHTML =
    '<tr><td colspan="10">Loading orders...</td></tr>';

  info.textContent = "";

  try {
    const { data, error } = await supabaseClient
      .from("orders")
      .select("id,customer_name,phone,address,city,pincode,items,total,status,created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    const orders = data || [];

    document.getElementById("totalOrders").textContent =
      orders.length;

    const total = orders.reduce(
      (sum, order) => sum + Number(order.total || 0),
      0
    );

    document.getElementById("totalValue").textContent =
      money(total);

    const pending = orders.filter(
      order => String(order.status || "").toLowerCase() === "pending"
    ).length;

    document.getElementById("pendingOrders").textContent =
      pending;

    if (orders.length === 0) {
      output.innerHTML =
        '<tr><td colspan="10">No orders found.</td></tr>';
      return;
    }

    const statuses = [
      "Pending",
      "Processing",
      "Shipped",
      "Delivered",
      "Cancelled"
    ];

    output.innerHTML = orders.map((order, index) => {
      const items = typeof order.items === "string"
        ? order.items
        : JSON.stringify(order.items || []);

      const date = order.created_at
        ? new Date(order.created_at).toLocaleString("en-IN")
        : "-";

      const currentStatus = String(order.status || "Pending");

      const availableStatuses = [...statuses];

      if (!availableStatuses.some(
        status => status.toLowerCase() === currentStatus.toLowerCase()
      )) {
        availableStatuses.push(currentStatus);
      }

      const options = availableStatuses.map(status =>
        `<option value="${escapeHTML(status)}"
          ${currentStatus.toLowerCase() === status.toLowerCase()
            ? "selected" : ""}>
          ${escapeHTML(status)}
        </option>`
      ).join("");

      return `
        <tr>
          <td>${escapeHTML(order.id)}</td>
          <td>${escapeHTML(order.customer_name)}</td>
          <td>${escapeHTML(order.phone)}</td>
          <td>${escapeHTML(order.address)}</td>
          <td>${escapeHTML(order.city)}</td>
          <td>${escapeHTML(order.pincode)}</td>
          <td>${escapeHTML(items)}</td>
          <td>${money(order.total)}</td>

          <td>
            <select class="status-select" data-index="${index}">
              ${options}
            </select>

            <button
              type="button"
              class="update-btn"
              data-index="${index}">
              Update
            </button>
          </td>

          <td>${escapeHTML(date)}</td>
        </tr>
      `;
    }).join("");

    output.querySelectorAll(".update-btn").forEach(button => {
      button.addEventListener("click", async () => {
        const index = Number(button.dataset.index);
        const select = output.querySelector(
          `.status-select[data-index="${index}"]`
        );

        await updateOrderStatus(orders[index].id, select.value, button);
      });
    });

  } catch (error) {
    output.innerHTML = "";
    info.textContent = "Order loading error: " + error.message;
  }
}

/* UPDATE ORDER STATUS */

async function updateOrderStatus(orderId, newStatus, button) {
  const info = document.getElementById("orderMessage");

  button.disabled = true;
  button.textContent = "Saving...";
  info.textContent = "Updating order status...";

  try {
    const { error } = await supabaseClient
      .from("orders")
      .update({ status: newStatus })
      .eq("id", orderId);

    if (error) throw error;

    info.textContent = "Order status updated successfully.";

    await loadOrders();

  } catch (error) {
    info.textContent = "Status update error: " + error.message;
    button.disabled = false;
    button.textContent = "Update";
  }
}

/* SHOW DASHBOARD */

async function showDashboard() {
  loginBox.style.display = "none";
  dashboard.style.display = "block";

  await loadOrders();
}

/* LOGIN */

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";
  showMessage("Checking login details...");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (!data.session) {
      throw new Error("No login session was returned.");
    }

    showMessage("Login successful.");

    await showDashboard();

  } catch (error) {
    showMessage("Login failed: " + error.message);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});

/* REFRESH */

document.getElementById("refreshBtn").addEventListener(
  "click",
  loadOrders
);

/* LOGOUT */

document.getElementById("logoutBtn").addEventListener(
  "click",
  async function() {
    try {
      const { error } = await supabaseClient.auth.signOut();

      if (error) throw error;

      dashboard.style.display = "none";
      loginBox.style.display = "block";

      document.getElementById("password").value = "";

      showMessage("You have logged out.");

    } catch (error) {
      alert("Logout error: " + error.message);
    }
  }
);

/* CHECK EXISTING SESSION */

async function checkLogin() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session) {
      await showDashboard();
    } else {
      showMessage("Connected to Supabase. Please log in.");
    }

  } catch (error) {
    showMessage("Session error: " + error.message);
  }
}

checkLogin();

</script>
<script src="script.js"></script>
</body>
</html>
