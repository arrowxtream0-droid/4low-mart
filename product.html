
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Product | 4LOW-MART</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .product-detail {
      max-width: 1200px;
      margin: 50px auto;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
    }

    .detail-image {
      background: #f5f5f5;
      border-radius: 16px;
      min-height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .detail-image img {
      width: 100%;
      height: 430px;
      object-fit: contain;
    }

    .detail-info h1 {
      font-size: 34px;
      margin: 15px 0;
    }

    .detail-rating {
      color: #ff6b2c;
      margin: 12px 0;
    }

    .detail-price {
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0;
    }

    .detail-original {
      color: #888;
      text-decoration: line-through;
      font-size: 17px;
      margin-left: 10px;
    }

    .detail-discount {
      display: inline-block;
      background: #ff6b2c;
      color: white;
      padding: 7px 12px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    .detail-description {
      color: #777;
      line-height: 1.8;
      margin: 20px 0;
    }

    .stock-status {
      color: #168b45;
      font-weight: bold;
      margin: 20px 0;
    }

    .detail-button {
      width: 100%;
      padding: 15px;
      background: #ff6b2c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .detail-button:hover {
      opacity: 0.85;
    }

    .back-link {
      display: inline-block;
      margin: 25px;
      color: #ff6b2c;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .product-detail {
        grid-template-columns: 1fr;
        margin: 15px auto;
        gap: 25px;
        padding: 15px;
      }

      .detail-image {
        min-height: 300px;
      }

      .detail-image img {
        height: 300px;
      }

      .detail-info h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-link">← Back to 4LOW-MART</a>

  <main class="product-detail">

    <div class="detail-image">
      <img id="product-image" src="" alt="Product">
    </div>

    <div class="detail-info">

      <span id="product-discount" class="detail-discount"></span>

      <h1 id="product-name">Loading product...</h1>

      <p id="product-rating" class="detail-rating"></p>

      <p class="detail-price">
        <span id="product-price"></span>
        <span id="product-original" class="detail-original"></span>
      </p>

      <p id="product-description" class="detail-description"></p>

      <p class="stock-status">● Available for purchase</p>

      <button id="add-to-cart" class="detail-button">
        Add to Cart
      </button>

      <button id="buy-now" class="detail-button">
        Buy Now
      </button>

    </div>

  </main>

  <script>
    const products = [
      {
        name: "Wireless Headphones",
        price: 1499,
        originalPrice: 2499,
        rating: 4.5,
        discount: "40% OFF",
        description: "Enjoy your music with these stylish wireless headphones. Designed for everyday listening.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "Smart Watch",
        price: 1999,
        originalPrice: 2999,
        rating: 4.3,
        discount: "33% OFF",
        description: "A modern smartwatch designed to complement your everyday lifestyle.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "Sports Shoes",
        price: 2499,
        originalPrice: 3499,
        rating: 4.6,
        discount: "29% OFF",
        description: "Comfortable sports shoes for everyday activities and casual wear.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "Everyday Backpack",
        price: 999,
        originalPrice: 1499,
        rating: 4.2,
        discount: "33% OFF",
        description: "A practical everyday backpack with a versatile design.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const productIndex = Number(params.get("id"));

    const product = Number.isInteger(productIndex)
      ? products[productIndex]
      : null;

    if (!product) {
      document.querySelector(".product-detail").textContent =
        "Product not found. Please return to the homepage.";
    } else {
      document.title = product.name + " | 4LOW-MART";

      document.getElementById("product-image").src = product.image;
      document.getElementById("product-image").alt = product.name;
      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-discount").textContent = product.discount;
      document.getElementById("product-rating").textContent =
        "★ " + product.rating + " / 5";
      document.getElementById("product-price").textContent =
        "₹" + product.price.toLocaleString("en-IN");
      document.getElementById("product-original").textContent =
        "₹" + product.originalPrice.toLocaleString("en-IN");
      document.getElementById("product-description").textContent =
        product.description;

      function addProductToCart() {
        let cart = [];

        try {
          const savedCart = localStorage.getItem("4lowMartCart");
          if (savedCart) {
            const parsed = JSON.parse(savedCart);
            if (Array.isArray(parsed)) cart = parsed;
          }
        } catch (error) {
          cart = [];
        }

        const existing = cart.find(item => item.name === product.name);

        if (existing) {
          existing.quantity++;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        localStorage.setItem("4lowMartCart", JSON.stringify(cart));
      }

      document.getElementById("add-to-cart").addEventListener("click", () => {
        addProductToCart();
        alert("Product added to cart!");
      });

      document.getElementById("buy-now").addEventListener("click", () => {
        addProductToCart();
        window.location.href = "checkout.html";
      });
    }
  </script>

</body>
</html>
